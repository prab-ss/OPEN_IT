<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <!-- REQUIRED FOR PROPER PHONE SCALING -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {
            background-color: #0d0d0d;
            color: #b928d6;

            font-family: 'Courier New', Courier, monospace;

            min-height: 100vh;
            min-height: 100dvh;

            margin: 0;

            padding: 30px;

            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;

            overflow-x: hidden;

            /* CRT scanlines */
            background-image: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.3) 50%
            );

            background-size: 100% 4px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            min-height: calc(100vh - 60px);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            margin-top: -40px;

            text-align: center;
        }


        /* =========================
           ASCII CAT
        ========================= */

        .ascii-cat {

            font-family: 'Courier New', Courier, monospace;

            font-size: 1.3rem;

            line-height: 1.2;

            white-space: pre;

            color: #c288f8;

            text-shadow:
                0 0 10px rgba(194, 136, 248, 0.7);

            margin: 0 0 40px 0;

            font-weight: bold;

            /* Prevent weird browser sizing */
            width: max-content;

            max-width: 100%;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            font-size: 1.25rem;

            color: #c288f8;

            text-shadow:
                0 0 8px rgba(194, 136, 248, 0.5);

            text-align: center;

            max-width: 90vw;
        }


        /* =========================
           CURSOR
        ========================= */

        .cursor {

            display: inline-block;

            width: 6px;

            background-color: #c288f8;

            box-shadow:
                0 0 8px rgba(194, 136, 248, 0.8);

            margin-left: 2px;

            animation: blink 0.8s infinite;
        }


        @keyframes blink {

            0%, 49% {
                opacity: 1;
            }

            50%, 100% {
                opacity: 0;
            }

        }


        /* =========================
           BUTTON
        ========================= */

        button {

            margin-top: 40px;

            background: transparent;

            color: #c288f8;

            border: 1px solid #c288f8;

            padding: 8px 18px;

            font-family: inherit;

            font-size: 0.9rem;

            cursor: pointer;

            border-radius: 4px;

            transition: all 0.2s;
        }


        button:hover {

            background: #c288f8;

            color: #0d0d0d;

            box-shadow:
                0 0 12px #c288f8;
        }


        /* =========================
           HEART
        ========================= */

        .heart {

            position: fixed;

            color: #ff4d4d;

            font-size: 20px;

            animation:
                float 1s ease-out forwards;

            pointer-events: none;

            z-index: 999;
        }


        @keyframes float {

            0% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translateY(-50px)
                    scale(1.5);
            }

        }


        /* =========================
           REUNION COUNTER
        ========================= */

        .counter {

            position: fixed;

            left: 50%;

            transform: translateX(-50%);

            bottom: 30px;

            font-size: 0.9rem;

            opacity: 0.8;

            color: #c288f8;

            text-align: center;

            text-shadow:
                0 0 6px rgba(194, 136, 248, 0.4);

            white-space: nowrap;
        }


        /* ==================================================
           📱 MOBILE
        ================================================== */

        @media screen and (max-width: 600px) {


            body {

                padding: 15px;

            }


            .container {

                min-height: 100dvh;

                margin-top: -20px;

                padding-bottom: 80px;

            }


            /*

                THIS IS THE IMPORTANT PART.

                The cat now scales according
                to the width of the phone.

            */

            .ascii-cat {

                font-size: clamp(
                    1.1rem,
                    5vw,
                    1.5rem
                );

                line-height: 1.1;

                margin-bottom: 35px;

                transform: scale(1);

                transform-origin: center;

            }


            .message {

                font-size: clamp(
                    0.85rem,
                    4vw,
                    1.1rem
                );

                max-width: 92vw;

            }


            button {

                margin-top: 30px;

                padding: 9px 16px;

                font-size: 0.85rem;

            }


            .counter {

                bottom: 20px;

                font-size: 0.75rem;

            }

        }


        /* ==================================================
           📱 SMALL PHONES
        ================================================== */

        @media screen and (max-width: 400px) {


            body {

                padding: 10px;

            }


            .container {

                padding-bottom: 70px;

            }


            .ascii-cat {

                font-size: 1rem;

                line-height: 1.05;

                margin-bottom: 30px;

            }


            .message {

                font-size: 0.82rem;

            }


            button {

                font-size: 0.8rem;

                padding: 8px 14px;

            }


            .counter {

                font-size: 0.68rem;

                bottom: 15px;

            }

        }


        /* ==================================================
           📱 VERY SMALL PHONES
        ================================================== */

        @media screen and (max-width: 350px) {


            .ascii-cat {

                font-size: 0.9rem;

            }


            .message {

                font-size: 0.75rem;

            }


            .counter {

                font-size: 0.63rem;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">


        <!-- ASCII CAT -->

        <pre class="ascii-cat">
   |\___/|  (\
  _.| o o  |_  ))
-(((---(((--------\</pre>


        <!-- MESSAGE -->

        <div class="message">

            <span id="typewriter"></span>

            <span class="cursor">&nbsp;</span>

        </div>


        <!-- BUTTON -->

        <button onclick="petHank(event)">
            🐾 Pet Hank
        </button>


    </div>


    <!-- =========================
         REUNION COUNTER
    ========================= -->

    <div class="counter">

        Days until reunion:
        <span id="days"></span>

    </div>


    <script>


        /* =====================================
           TYPEWRITER
        ===================================== */

        const message =
            "don't worry, hank misses you too ";

        let index = 0;


        function typeWriter() {

            if (index < message.length) {

                document.getElementById(
                    "typewriter"
                ).innerHTML +=
                    message.charAt(index);

                index++;

                setTimeout(
                    typeWriter,
                    70
                );

            }

        }



        /* =====================================
           MEOW
        ===================================== */

        const meow =
            new Audio("meow.wav");


        function petHank(e) {


            /* Play sound */

            meow.currentTime = 0;

            meow.play().catch(error => {

                console.log(
                    "Audio could not play:",
                    error
                );

            });


            /* Create heart */

            const heart =
                document.createElement("div");


            heart.className =
                "heart";


            heart.innerHTML =
                "❤️";


            heart.style.left =
                e.clientX + "px";


            heart.style.top =
                e.clientY + "px";


            document.body.appendChild(
                heart
            );


            /* Remove heart */

            setTimeout(() => {

                heart.remove();

            }, 1000);

        }



        /* =====================================
           REUNION DATE
        ===================================== */

        const reunionDate =
            new Date("2026-08-15");


        function updateCounter() {


            const today =
                new Date();


            today.setHours(
                0, 0, 0, 0
            );


            reunionDate.setHours(
                0, 0, 0, 0
            );


            const difference =
                reunionDate - today;


            const days =
                Math.ceil(
                    difference /
                    (1000 * 60 * 60 * 24)
                );


            document.getElementById(
                "days"
            ).textContent =
                Math.max(days, 0);

        }



        /* =====================================
           PAGE LOAD
        ===================================== */

        window.onload = function () {

            typeWriter();

            updateCounter();

        };

    </script>


</body>
</html>
